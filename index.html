<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Точка Опоры</title>
<style>
:root{--bg:#f6f4ed;--surface:#fffefa;--ink:#24352f;--muted:#718078;--green:#286b55;--green2:#e3eee7;--line:#e7e5dc;--shadow:0 12px 35px rgba(40,65,53,.07)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,Arial,sans-serif}
button,input{font:inherit}button{cursor:pointer;border:0}
.topbar{min-height:72px;background:rgba(255,254,250,.96);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px max(5vw,22px);position:sticky;top:0;z-index:5}
.brand{font-weight:750;font-size:19px;display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;border-radius:11px;background:var(--green);color:white;display:grid;place-items:center;font-size:18px}
.nav{display:flex;gap:8px}.nav button{background:transparent;color:var(--muted);padding:9px 13px;border-radius:20px;font-size:14px}
.nav button.active,.nav button:hover{background:var(--green2);color:var(--green)}
.wrap{max-width:1120px;margin:auto;padding:42px 24px 80px}
.eyebrow{color:var(--green);font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:38px;align-items:center;padding:36px 0 52px}
.hero h1{font:500 clamp(36px,5vw,58px)/1.08 Georgia,serif;margin:12px 0 18px;max-width:620px}
.hero h1 em{color:var(--green);font-weight:400}
.lead{font-size:17px;color:var(--muted);max-width:570px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.primary,.secondary{padding:13px 21px;border-radius:24px;font-weight:650}
.primary{background:var(--green);color:white}.primary:hover{background:#1e5744}
.secondary{background:var(--surface);color:var(--green);border:1px solid var(--line)}
.hero-panel{background:var(--green2);border-radius:28px;padding:27px;min-height:280px}
.panel-top{display:flex;justify-content:space-between;color:var(--green);font-size:13px}
.mood-title{font:25px Georgia,serif;margin:24px 0 14px}
.mood-options{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.mood{background:rgba(255,255,255,.75);border:1px solid transparent;border-radius:13px;padding:12px 8px;text-align:center;color:var(--ink);font-size:13px}
.mood:hover,.mood.selected{border-color:var(--green);background:white}
.recommendations{margin-top:20px;padding-top:18px;border-top:1px solid #c9dace}
.recommendations h3{font:22px Georgia,serif;margin:0 0 12px}
.recommendation-group+.recommendation-group{margin-top:18px}
.resource-link{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 14px;margin-top:8px;background:rgba(255,255,255,.82);border:1px solid #d9e5dc;border-radius:13px;color:var(--ink);text-decoration:none}
.resource-link:hover{border-color:var(--green);background:white}
.resource-link strong{display:block;font-size:14px}.resource-link small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.arrow{color:var(--green);font-size:19px;flex:none}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:20px 0}
.section-head h2{font:32px Georgia,serif;margin:4px 0}
.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.feature{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:21px}
.feature .symbol{font-size:23px}.feature h3{margin:12px 0 5px;font-size:17px}
.feature p{color:var(--muted);font-size:14px;margin:0}
.page-title{font:42px Georgia,serif;margin:8px 0}
.toolbar{display:flex;gap:12px;margin:25px 0 18px;flex-wrap:wrap}
.search{flex:1;min-width:220px;padding:13px 16px;border:1px solid var(--line);border-radius:13px;background:var(--surface);outline:none}
.search:focus{border-color:var(--green)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.chip{background:var(--surface);border:1px solid var(--line);padding:8px 13px;border-radius:20px;color:var(--muted);font-size:13px}
.chip.active{background:var(--green2);border-color:#c7dbce;color:var(--green)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.test-card{background:var(--surface);border:1px solid var(--line);border-radius:19px;padding:20px;display:flex;flex-direction:column;min-height:205px}
.tag{font-size:11px;color:var(--green);background:var(--green2);padding:5px 9px;border-radius:20px;align-self:flex-start}
.test-card h3{font:23px Georgia,serif;margin:15px 0 8px}
.test-card p{color:var(--muted);font-size:14px;margin:0 0 18px}
.card-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:auto;font-size:12px;color:var(--muted)}
.text-btn{background:transparent;color:var(--green);font-weight:700;padding:7px 0;text-decoration:none}
.resource-list{display:grid;gap:8px;margin-top:15px}
.resource-list .resource-link{margin:0}
.empty{text-align:center;color:var(--muted);padding:35px;grid-column:1/-1}
.footer{border-top:1px solid var(--line);padding:24px;text-align:center;color:var(--muted);font-size:12px}
@media(max-width:760px){.topbar{flex-wrap:wrap;gap:10px;padding:13px 18px}.nav{order:3;width:100%;overflow:auto}.nav button{white-space:nowrap}.hero{grid-template-columns:1fr;padding-top:15px}.feature-grid,.cards{grid-template-columns:1fr}.wrap{padding:28px 17px 55px}.page-title{font-size:35px}.mood-options{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">✳</span> Точка Опоры</div>
  <nav class="nav" aria-label="Основная навигация">
    <button data-page="home" class="active">Главная</button>
    <button data-page="catalog">Тесты и материалы</button>
    <button data-page="help">Самопомощь</button>
  </nav>
</header>
<main class="wrap" id="app"></main>
<footer class="footer">Точка Опоры</footer>
<script>
const app=document.getElementById('app');

const resources=[
  {group:'Узнать себя',category:'Самопознание',items:[
    {type:'Тест',title:'16 типов личности',description:'Познавательный тест',url:'https://vopore.ru/assessment/type16'},
    {type:'Тест',title:'Тест на профориентацию',description:'Какая работа подходит',url:'https://vopore.ru/assessment/career_interests'},
    {type:'Инструмент',title:'Чего я хочу',description:'Ценности и направление',url:'https://vopore.ru/tools/values-and-direction'}
  ]},
  {group:'Не сплю',category:'Сон и отдых',items:[
    {type:'Тест',title:'Тест на бессонницу SCI-8',description:'8 вопросов · 2 мин',url:'https://vopore.ru/assessment/sci8'},
    {type:'Гид',title:'Не могу уснуть',description:'Что делать этой ночью',url:'https://vopore.ru/guides/sleep-onset'},
    {type:'Программа',title:'Проблемы со сном',description:'Уроки и практика',url:'https://vopore.ru/support/insomnia'}
  ]}
];

let page='home',query='',category='Все',selectedMood='';

function resourceLink(item){
  return `<a class="resource-link" href="${item.url}" target="_blank" rel="noopener noreferrer">
    <span><strong>${item.type} · ${item.title}</strong><small>${item.description}</small></span>
    <span class="arrow" aria-hidden="true">↗</span>
  </a>`;
}

function recommendationsForMood(mood){
  if(!mood) return '';
  let chosen;
  if(mood==='Усталость') chosen=[resources[1]];
  else if(mood==='Спокойствие'||mood==='Интерес') chosen=[resources[0]];
  else chosen=resources;
  return `<div class="recommendations" aria-live="polite">
    <h3>Что может быть полезно</h3>
    ${chosen.map(group=>`<section class="recommendation-group">
      <h3>${group.group}</h3>
      ${group.items.map(resourceLink).join('')}
    </section>`).join('')}
  </div>`;
}

function home(){
 const moods=['Спокойствие','Усталость','Напряжение','Интерес','Не знаю','Другое'];
 return `<section class="hero">
  <div>
    <div class="eyebrow">Пространство для заботы о себе</div>
    <h1>Лучше понимать себя — <em>маленькими шагами</em></h1>
    <p class="lead">Тесты и практические материалы, которые помогают внимательнее относиться к своему состоянию и повседневным привычкам.</p>
    <div class="actions">
      <button class="primary" onclick="setPage('catalog')">Подобрать материал <span aria-hidden="true">→</span></button>
      <button class="secondary" onclick="setPage('help')">Самопомощь</button>
    </div>
  </div>
  <div class="hero-panel">
    <div class="panel-top"><span>Подобрать материалы</span><span>01 / 01</span></div>
    <div class="mood-title">Что сейчас ближе всего к вашему состоянию?</div>
    <div class="mood-options">
      ${moods.map(m=>`<button class="mood ${selectedMood===m?'selected':''}" aria-pressed="${selectedMood===m}" onclick="selectMood('${m}')">${m}</button>`).join('')}
    </div>
    ${recommendationsForMood(selectedMood)}
  </div>
 </section>
 <div class="section-head"><div><div class="eyebrow">С чего начать</div><h2>Выберите подходящий формат</h2></div></div>
 <section class="feature-grid">
  <article class="feature"><div class="symbol">◉</div><h3>Психологические тесты</h3><p>Тесты для самопознания и оценки повседневных привычек.</p></article>
  <article class="feature"><div class="symbol">✳</div><h3>Практические упражнения</h3><p>Небольшие действия, которые можно включить в повседневную жизнь.</p></article>
  <article class="feature"><div class="symbol">▤</div><h3>Материалы о самопомощи</h3><p>Информация и практические рекомендации по разным темам.</p></article>
 </section>`;
}

function selectMood(mood){selectedMood=mood;render();const panel=document.querySelector('.recommendations');if(panel)panel.scrollIntoView({behavior:'smooth',block:'nearest'});}

function catalog(){
 const all=resources.flatMap(g=>g.items.map(item=>({...item,group:g.group,category:g.category})));
 const filtered=all.filter(x=>(category==='Все'||x.category===category)&&(`${x.title} ${x.description} ${x.group} ${x.type}`).toLowerCase().includes(query.toLowerCase()));
 return `<div class="eyebrow">Каталог</div><h1 class="page-title">Тесты и материалы</h1>
 <p class="muted">Выберите материал по интересующей теме.</p>
 <div class="toolbar"><input class="search" placeholder="Поиск по названию или теме…" value="${query.replaceAll('"','&quot;')}" oninput="query=this.value;renderCatalogKeepFocus(this.selectionStart)"></div>
 <div class="filters">${['Все','Самопознание','Сон и отдых'].map(c=>`<button class="chip ${category===c?'active':''}" onclick="category='${c}';render()">${c}</button>`).join('')}</div>
 <div class="cards">${filtered.length?filtered.map(x=>`<article class="test-card"><span class="tag">${x.type} · ${x.group}</span><h3>${x.title}</h3><p>${x.description}</p><div class="card-bottom"><span>${x.category}</span><a class="text-btn" href="${x.url}" target="_blank" rel="noopener noreferrer">Открыть ↗</a></div></article>`).join(''):'<div class="empty">По вашему запросу ничего не найдено. Попробуйте изменить формулировку или выбрать другую категорию.</div>'}</div>`;
}

function renderCatalogKeepFocus(pos){render();const input=document.querySelector('.search');if(input){input.focus();input.setSelectionRange(pos,pos);}}
function help(){
 return `<div class="eyebrow">Практические материалы</div><h1 class="page-title">Самопомощь</h1>
 <p class="muted">Материалы и практики, сгруппированные по темам.</p>
 <div class="cards">
  <article class="test-card"><span class="tag">Сон и отдых</span><h3>Не могу уснуть</h3><p>Рекомендации о том, что можно сделать этой ночью.</p><div class="card-bottom"><span>Гид</span><a class="text-btn" href="https://vopore.ru/guides/sleep-onset" target="_blank" rel="noopener noreferrer">Открыть ↗</a></div></article>
  <article class="test-card"><span class="tag">Сон и отдых</span><h3>Проблемы со сном</h3><p>Последовательная программа с уроками и практикой.</p><div class="card-bottom"><span>Программа</span><a class="text-btn" href="https://vopore.ru/support/insomnia" target="_blank" rel="noopener noreferrer">Открыть ↗</a></div></article>
  <article class="test-card"><span class="tag">Самопознание</span><h3>Чего я хочу</h3><p>Инструмент для размышления о ценностях и направлении.</p><div class="card-bottom"><span>Инструмент</span><a class="text-btn" href="https://vopore.ru/tools/values-and-direction" target="_blank" rel="noopener noreferrer">Открыть ↗</a></div></article>
 </div>`;
}

function setPage(next){page=next;query='';category='Все';render();window.scrollTo(0,0);}
function render(){
 app.innerHTML=page==='home'?home():page==='catalog'?catalog():help();
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
render();
</script>
</body>
</html>
