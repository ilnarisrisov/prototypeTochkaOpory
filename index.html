<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Точка Опоры — прототип</title>
<style>
:root{--bg:#f6f4ed;--surface:#fffefa;--ink:#24352f;--muted:#718078;--green:#286b55;--green2:#e3eee7;--line:#e7e5dc;--peach:#f7e7df;--yellow:#f5edcf;--blue:#e4edf2;--shadow:0 12px 35px rgba(40,65,53,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}.topbar{height:72px;background:rgba(255,254,250,.94);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(5vw,22px);position:sticky;top:0;z-index:5}.brand{font-weight:750;font-size:19px;display:flex;align-items:center;gap:10px}.logo{width:32px;height:32px;border-radius:11px;background:var(--green);color:white;display:grid;place-items:center;font-size:18px}.nav{display:flex;gap:8px}.nav button{background:transparent;color:var(--muted);padding:9px 13px;border-radius:20px;font-size:14px}.nav button.active,.nav button:hover{background:var(--green2);color:var(--green)}.login{background:var(--green);color:white;border-radius:22px;padding:10px 18px;font-size:14px}.wrap{max-width:1120px;margin:auto;padding:42px 24px 80px}.eyebrow{color:var(--green);font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:700}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:38px;align-items:center;padding:36px 0 52px}.hero h1{font:500 clamp(36px,5vw,58px)/1.08 Georgia,serif;margin:12px 0 18px;max-width:620px}.hero h1 em{color:var(--green);font-weight:400}.lead{font-size:17px;color:var(--muted);max-width:570px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}.primary,.secondary{padding:13px 21px;border-radius:24px;font-weight:650}.primary{background:var(--green);color:white}.primary:hover{background:#1e5744}.secondary{background:var(--surface);color:var(--green);border:1px solid var(--line)}.hero-panel{background:var(--green2);border-radius:28px;padding:27px;min-height:280px;display:flex;flex-direction:column;justify-content:space-between}.panel-top{display:flex;justify-content:space-between;color:var(--green);font-size:13px}.mood-title{font:25px Georgia,serif;margin:30px 0 14px}.mood-options{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.mood{background:rgba(255,255,255,.75);border:1px solid transparent;border-radius:13px;padding:12px 8px;text-align:center;color:var(--ink);font-size:13px}.mood.selected{border-color:var(--green);background:white}.note{font-size:12px;color:var(--muted);margin-top:12px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:20px 0}.section-head h2{font:32px Georgia,serif;margin:4px 0}.muted{color:var(--muted)}.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.feature{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:21px}.feature .symbol{font-size:23px}.feature h3{margin:12px 0 5px;font-size:17px}.feature p{color:var(--muted);font-size:14px;margin:0}.page-title{font:42px Georgia,serif;margin:8px 0}.toolbar{display:flex;gap:12px;margin:25px 0 18px;flex-wrap:wrap}.search{flex:1;min-width:220px;padding:13px 16px;border:1px solid var(--line);border-radius:13px;background:var(--surface);outline:none}.search:focus{border-color:var(--green)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}.chip{background:var(--surface);border:1px solid var(--line);padding:8px 13px;border-radius:20px;color:var(--muted);font-size:13px}.chip.active{background:var(--green2);border-color:#c7dbce;color:var(--green)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.test-card{background:var(--surface);border:1px solid var(--line);border-radius:19px;padding:20px;display:flex;flex-direction:column;min-height:225px}.tag{font-size:11px;color:var(--green);background:var(--green2);padding:5px 9px;border-radius:20px;align-self:flex-start}.test-card h3{font:23px Georgia,serif;margin:15px 0 8px}.test-card p{color:var(--muted);font-size:14px;margin:0 0 18px}.card-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:auto;font-size:12px;color:var(--muted)}.text-btn{background:transparent;color:var(--green);font-weight:700;padding:7px 0}.detail{max-width:780px;margin:10px auto;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:clamp(22px,5vw,42px)}.detail h1{font:38px Georgia,serif;margin:8px 0 12px}.detail p{color:var(--muted)}.info-row{display:flex;gap:22px;flex-wrap:wrap;margin:20px 0;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}.instruction{background:#f5f4ed;border-radius:14px;padding:17px;margin:22px 0;color:#53645b;font-size:14px}.progress-head{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:5px 0 9px}.progress{height:7px;background:#e9e9e1;border-radius:8px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green);transition:width .2s}.question{font:27px/1.3 Georgia,serif;margin:27px 0 22px}.answers{display:grid;gap:10px}.answer{padding:14px 16px;border:1px solid var(--line);border-radius:13px;background:white;text-align:left;color:var(--ink)}.answer:hover,.answer.chosen{border-color:var(--green);background:var(--green2)}.test-controls{display:flex;justify-content:space-between;gap:12px;margin-top:28px}.result-score{background:var(--peach);border-radius:18px;padding:24px;margin:22px 0;display:flex;justify-content:space-between;align-items:center;gap:15px}.score{font:54px Georgia,serif}.result-block{border-top:1px solid var(--line);padding:18px 0}.result-block h3{margin:0 0 7px}.disclaimer{background:#f5f4ed;padding:14px;border-radius:12px;font-size:12px;color:var(--muted);margin-top:20px}.back{background:transparent;color:var(--green);padding:8px 0;font-weight:650;margin-bottom:15px}.empty{text-align:center;color:var(--muted);padding:35px}.footer{border-top:1px solid var(--line);padding:24px;text-align:center;color:var(--muted);font-size:12px}
@media(max-width:760px){.topbar{height:auto;min-height:66px;flex-wrap:wrap;padding:13px 18px;gap:10px}.nav{order:3;width:100%;overflow:auto}.nav button{white-space:nowrap}.hero{grid-template-columns:1fr;padding-top:15px}.hero-panel{min-height:240px}.feature-grid,.cards{grid-template-columns:1fr}.wrap{padding:28px 17px 55px}.page-title{font-size:35px}.result-score{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">✳</span> Точка Опоры</div>
  <nav class="nav" aria-label="Основная навигация">
    <button data-page="home" class="active">Главная</button><button data-page="catalog">Тесты</button><button data-page="help">Самопомощь</button>
  </nav>
  <button class="login" onclick="toast('В демонстрационном прототипе авторизация не реализована')">Войти</button>
</header>
<main class="wrap" id="app"></main>
<footer class="footer">Учебный UX-прототип · Демонстрационные данные · Не является медицинским сервисом</footer>
<div id="toast" style="position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#24352f;color:white;padding:11px 18px;border-radius:20px;display:none;z-index:10;font-size:13px"></div>
<script>
const app=document.getElementById('app');
const tests=[
 {id:'stress',title:'Повседневное напряжение',category:'Самочувствие',time:'3–4 минуты',desc:'Небольшой демонстрационный опрос о том, как вы чувствовали себя в последнее время.',tag:'Самочувствие'},
 {id:'sleep',title:'Привычки сна',category:'Сон',time:'2–3 минуты',desc:'Помогает обратить внимание на привычки, связанные с режимом и качеством отдыха.',tag:'Сон'},
 {id:'energy',title:'Уровень энергии',category:'Самочувствие',time:'2 минуты',desc:'Предлагает оценить повседневную активность и восстановление сил.',tag:'Самочувствие'},
 {id:'focus',title:'Концентрация внимания',category:'Работа и учёба',time:'3 минуты',desc:'Демонстрационный опрос о том, насколько легко удерживать внимание на задачах.',tag:'Работа и учёба'},
 {id:'balance',title:'Баланс нагрузки и отдыха',category:'Образ жизни',time:'3 минуты',desc:'Помогает оценить, хватает ли времени на отдых и восстановление.',tag:'Образ жизни'}
];
const questions=[
 'Как часто за последнюю неделю вам было сложно расслабиться после обычного дня?',
 'Насколько легко вам удавалось переключаться с дел на отдых?',
 'Как часто вы чувствовали, что повседневных задач становится слишком много?',
 'Насколько хорошо вам удавалось восстанавливать силы после напряжённого дня?',
 'Как часто вы находили время на занятия, которые помогают вам отдохнуть?'
];
const options=['Совсем не сложно / почти никогда','Иногда','Часто','Почти постоянно'];
let page='home',category='Все',query='',current=0,answers=[],selectedTest=tests[0];
function setPage(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo(0,0)}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',2300)}
function home(){return `<section class="hero"><div><div class="eyebrow">Пространство для заботы о себе</div><h1>Лучше понимать себя — <em>маленькими шагами</em></h1><p class="lead">Тесты и практические материалы, которые помогают внимательнее относиться к своему состоянию и повседневным привычкам.</p><div class="actions"><button class="primary" onclick="setPage('catalog')">Подобрать тест <span aria-hidden="true">→</span></button><button class="secondary" onclick="setPage('help')">Найти упражнение</button></div><p class="note">Бесплатные материалы · Без регистрации для ознакомления</p></div><div class="hero-panel"><div class="panel-top"><span>Небольшая пауза</span><span>01 / 01</span></div><div><div class="mood-title">Что сейчас ближе всего к вашему состоянию?</div><div class="mood-options">${['Спокойствие','Усталость','Напряжение','Интерес','Не знаю','Другое'].map(x=>`<button class="mood" onclick="document.querySelectorAll('.mood').forEach(b=>b.classList.remove('selected'));this.classList.add('selected')">${x}</button>`).join('')}</div><div class="note">Необязательный вопрос для знакомства с интерфейсом.</div></div></div></section><div class="section-head"><div><div class="eyebrow">С чего начать</div><h2>Выберите подходящий формат</h2></div></div><section class="feature-grid"><article class="feature"><div class="symbol">◉</div><h3>Психологические тесты</h3><p>Короткие опросы с описанием назначения и понятными инструкциями.</p></article><article class="feature"><div class="symbol">✳</div><h3>Практические упражнения</h3><p>Небольшие действия, которые можно включить в повседневную жизнь.</p></article><article class="feature"><div class="symbol">▤</div><h3>Материалы о самопомощи</h3><p>Информация, сгруппированная по темам и жизненным ситуациям.</p></article></section>`}
function catalog(){let filtered=tests.filter(t=>(category==='Все'||t.category===category)&&(t.title+' '+t.desc+' '+t.category).toLowerCase().includes(query.toLowerCase()));return `<div class="eyebrow">Каталог</div><h1 class="page-title">Психологические тесты</h1><p class="muted">Выберите тему или найдите тест по названию. В карточках оставлена только основная информация.</p><div class="toolbar"><input class="search" placeholder="Поиск по названию или теме…" value="${query.replaceAll('"','&quot;')}" oninput="query=this.value;const pos=this.selectionStart;renderCatalogKeepFocus(pos)"></div><div class="filters">${['Все','Самочувствие','Сон','Работа и учёба','Образ жизни'].map(c=>`<button class="chip ${category===c?'active':''}" onclick="category='${c}';render()">${c}</button>`).join('')}</div><div class="cards">${filtered.length?filtered.map(t=>`<article class="test-card"><span class="tag">${t.tag}</span><h3>${t.title}</h3><p>${t.desc}</p><div class="card-bottom"><span>◷ ${t.time}</span><button class="text-btn" onclick="openTest('${t.id}')">Подробнее →</button></div></article>`).join(''):'<div class="empty">По вашему запросу ничего не найдено. Попробуйте изменить формулировку или выбрать другую категорию.</div>'}</div>`}
function renderCatalogKeepFocus(pos){render();const next=document.querySelector('.search');if(next){next.focus();next.setSelectionRange(pos,pos)}}
function openTest(id){selectedTest=tests.find(t=>t.id===id)||tests[0];page='detail';render();window.scrollTo(0,0)}
function detail(){return `<button class="back" onclick="setPage('catalog')">← Назад к каталогу</button><section class="detail"><span class="tag">${selectedTest.tag}</span><h1>${selectedTest.title}</h1><p>${selectedTest.desc}</p><div class="info-row"><span>◷ ${selectedTest.time}</span><span>5 вопросов</span><span>Демонстрационный формат</span></div><h3>О тесте</h3><p>Этот пример показывает, как может быть организована страница перед началом опроса: краткое назначение, ожидаемое время и отдельная инструкция.</p><div class="instruction"><b>Как пройти опрос</b><br>Прочитайте каждый вопрос и выберите один вариант ответа, который лучше всего подходит к вашему опыту. Здесь нет правильных или неправильных ответов. Можно вернуться к предыдущему вопросу.</div><button class="primary" onclick="startTest()">Начать тест →</button></section>`}
function startTest(){current=0;answers=[];page='quiz';render();window.scrollTo(0,0)}
function quiz(){return `<section class="detail"><button class="back" onclick="page='detail';render()">← К описанию теста</button><div class="eyebrow">${selectedTest.title}</div><div class="progress-head"><span>Вопрос ${current+1} из ${questions.length}</span><span>${Math.round(current/questions.length*100)}%</span></div><div class="progress"><span style="width:${current/questions.length*100}%"></span></div><div class="question">${questions[current]}</div><div class="answers">${options.map((o,i)=>`<button class="answer ${answers[current]===i?'chosen':''}" onclick="choose(${i})">${o}</button>`).join('')}</div><div class="test-controls"><button class="secondary" ${current===0?'disabled style="opacity:.45;cursor:default"':''} onclick="prev()">Назад</button><button class="primary" ${answers[current]===undefined?'disabled style="opacity:.45;cursor:default"':''} onclick="next()">${current===questions.length-1?'Показать результат':'Следующий вопрос →'}</button></div><div class="note">Ваш выбор отмечается сразу. Ответы используются только для демонстрации прототипа.</div></section>`}
function choose(i){answers[current]=i;render()}
function prev(){if(current>0){current--;render()}}
function next(){if(answers[current]===undefined)return;if(current<questions.length-1){current++;render()}else{page='result';render();window.scrollTo(0,0)}}
function result(){let score=answers.reduce((a,b)=>a+b,0);let label=score<5?'Небольшая выраженность':score<11?'Умеренная выраженность':'Повышенная выраженность';return `<section class="detail"><div class="eyebrow">Опрос завершён</div><h1>Ваш результат</h1><p>Ответы собраны. Ниже показан пример того, как можно структурировать результат и пояснения к нему.</p><div class="result-score"><div><div class="eyebrow">Демонстрационный показатель</div><div class="score">${score}<span style="font-size:19px;color:#718078"> / 15</span></div><b>${label}</b></div><div style="font-size:42px">✳</div></div><div class="result-block"><h3>Как это понимать</h3><p>Показатель рассчитан по условным вопросам прототипа. Он не является психологическим заключением и не позволяет делать выводы о состоянии здоровья.</p></div><div class="result-block"><h3>Что можно сделать дальше</h3><p>Попробуйте обратить внимание на режим отдыха, распределение повседневных задач и занятия, которые помогают вам восстанавливаться. Вы можете выбрать практическое упражнение или пройти другой демонстрационный опрос.</p></div><div class="disclaimer">Важно: данный тест создан исключительно для демонстрации пользовательского сценария. Вопросы и шкала условные, не являются валидированной методикой и не предназначены для диагностики.</div><div class="actions"><button class="primary" onclick="setPage('catalog')">Выбрать другой тест</button><button class="secondary" onclick="setPage('help')">К упражнениям</button></div></section>`}
function help(){return `<div class="eyebrow">Практические материалы</div><h1 class="page-title">Небольшие шаги для себя</h1><p class="muted">В этом разделе материалы сгруппированы по темам. Выберите то, что сейчас актуально.</p><div class="cards">${[['Сон и отдых','Спокойный вечер','Небольшой план подготовки ко сну и снижения вечерней активности.'],['Повседневная нагрузка','Пауза между задачами','Короткая практика переключения внимания и отдыха.'],['Внимание к себе','Дневник самочувствия','Простая запись наблюдений о настроении, энергии и сне.']].map((x,i)=>`<article class="test-card"><span class="tag">Практика ${i+1}</span><h3>${x[0]}</h3><b>${x[1]}</b><p>${x[2]}</p><div class="card-bottom"><span>5 минут</span><button class="text-btn" onclick="toast('Демонстрационный материал: раздел будет дополнен')">Открыть →</button></div></article>`).join('')}</div>`}
function render(){app.innerHTML=page==='home'?home():page==='catalog'?catalog():page==='detail'?detail():page==='quiz'?quiz():page==='result'?result():help();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page||page==='detail'&&b.dataset.page==='catalog'||page==='quiz'&&b.dataset.page==='catalog'||page==='result'&&b.dataset.page==='catalog'))}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{query='';category='Все';setPage(b.dataset.page)}));
render();
</script>
</body>
</html>
